# Backup uptime ping (cron-job.org is the primary, every 10 minutes). GitHub may delay scheduled runs,
# so this only covers gaps. Set the repository variable CONFAM_URL (Settings > Variables > Actions).
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.CONFAM_URL != '' }}
    timeout-minutes: 3
    steps:
      - name: Ping health (also checks the Lightning wallet)
        env:
          CONFAM_URL: ${{ vars.CONFAM_URL }}
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 20 "$CONFAM_URL/api/health?deep=1"
